<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3dGarments Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5b3a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="lab">
    <aside class="side">
      <header class="head">
        <div class="logo">3d<b>Garments</b> <span>LAB</span></div>
        <p>Human, rig &amp; pose workbench. Edits here are the real <code>web/src/human</code> + <code>web/src/scene</code> code.</p>
      </header>

      <section>
        <h3>Body</h3>
        <div class="chips" id="presets"></div>
        <div id="shape-sliders"></div>
      </section>

      <section>
        <h3>Pose</h3>
        <div class="chips" id="poses"></div>
        <label class="row">Bone <select id="bone"></select></label>
        <div id="bone-sliders"></div>
        <pre id="pose-json" class="small"></pre>
      </section>

      <section>
        <h3>Debug</h3>
        <label class="check"><input type="checkbox" id="dbg-skeleton" /> Skeleton</label>
        <label class="check"><input type="checkbox" id="dbg-wire" /> Wireframe</label>
        <label class="check"><input type="checkbox" id="dbg-weights" /> Weights of selected bone</label>
        <label class="check"><input type="checkbox" id="dbg-spin" /> Turntable</label>
        <div class="chips views">
          <button data-view="front">Front</button><button data-view="three">¾</button><button data-view="side">Side</button>
          <button data-view="back">Back</button><button data-view="portrait">Face</button><button data-view="feet">Feet</button>
        </div>
      </section>

      <section>
        <h3>Stats</h3>
        <pre id="stats">—</pre>
      </section>
    </aside>

    <main class="view" id="view"></main>
  </div>
  <script type="module" src="./src/lab.js"></script>
</body>
</html>
