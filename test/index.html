<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3dGarments Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5b3a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="lab">
    <aside class="side">
      <header class="head">
        <div class="logo">3d<b>Garments</b> <span>LAB</span></div>
        <p>Avatar, mannequin &amp; clothing workbench. Edits here are the real <code>web/src/scene</code> code.</p>
      </header>

      <section>
        <h3>Garments</h3>
        <div class="chips" id="samples"></div>
        <label class="btn">
          <input type="file" id="upload" accept="image/*" multiple hidden />Upload photo(s)
        </label>
        <div id="worn" class="worn"></div>
      </section>

      <section>
        <h3>Body</h3>
        <div id="body-sliders"></div>
      </section>

      <section id="fit-section" hidden>
        <h3>Fit · <span id="fit-name"></span></h3>
        <label class="row">Type
          <select id="fit-category">
            <option>top</option><option>outerwear</option><option>dress</option>
            <option>skirt</option><option>pants</option><option>shorts</option>
          </select>
        </label>
        <div id="fit-sliders"></div>
      </section>

      <section>
        <h3>Debug</h3>
        <label class="check"><input type="checkbox" id="dbg-wire" /> Wireframe</label>
        <label class="check"><input type="checkbox" id="dbg-regions" /> Region colours <small class="legend"><i style="--c:#1a80ff"></i>shell <i style="--c:#ff2020"></i>sleeve L <i style="--c:#ffb300"></i>sleeve R <i style="--c:#0dd940"></i>leg L <i style="--c:#9933ff"></i>leg R</small></label>
        <label class="check"><input type="checkbox" id="dbg-mannequin" checked /> Mannequin</label>
        <label class="check"><input type="checkbox" id="dbg-garments" checked /> Garments</label>
        <label class="check"><input type="checkbox" id="dbg-back" /> Hide back panels</label>
        <label class="check"><input type="checkbox" id="dbg-spin" /> Turntable</label>
        <div class="chips views">
          <button data-view="front">Front</button><button data-view="side">Side</button>
          <button data-view="back">Back</button><button data-view="close">Close</button>
          <button id="shot">PNG</button>
        </div>
      </section>

      <section>
        <h3>Stats</h3>
        <pre id="stats">—</pre>
      </section>
    </aside>

    <main class="view" id="view"></main>

    <aside class="inspector" id="inspector" hidden>
      <div class="inspector-head">Silhouette · <span id="insp-name"></span></div>
      <canvas id="insp-canvas" width="320" height="320"></canvas>
      <div class="insp-legend"><i style="--c:#3ddc97"></i>torso edges <i style="--c:#ffd24a"></i>armpit <i style="--c:#3ad7ff"></i>crotch <i style="--c:#ff4fd8"></i>sleeve axis</div>
      <pre id="insp-json"></pre>
    </aside>
  </div>
  <script type="module" src="./src/lab.js"></script>
</body>
</html>
