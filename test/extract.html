<!doctype html><html><body><script type="module">
// Dump an FBX's mesh + skeleton (world space, bind pose) as JSON for tools/body/prepare.py
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
const f = new URLSearchParams(location.search).get('f');
const o = await new FBXLoader().loadAsync(`/@fs/home/user/3dGarments/assets/${f}.fbx`);
o.updateMatrixWorld(true);
const meshes = [];
o.traverse((c) => { if (c.isMesh) meshes.push(c); });
const m = meshes[0], g = m.geometry;
const pos = g.attributes.position.clone().applyMatrix4(m.matrixWorld);
const nrm = g.attributes.normal.clone().applyNormalMatrix(new THREE.Matrix3().getNormalMatrix(m.matrixWorld));
const out = { n: meshes.length, P: Array.from(pos.array), N: Array.from(nrm.array), UV: g.attributes.uv ? Array.from(g.attributes.uv.array) : null,
  I: g.index ? Array.from(g.index.array) : null };
if (m.isSkinnedMesh) {
  // bind-pose bone world transforms = inverse of boneInverses in the mesh's bind space
  const bones = m.skeleton.bones;
  out.SI = Array.from(g.attributes.skinIndex.array); out.SW = Array.from(g.attributes.skinWeight.array);
  out.bones = bones.map((b, i) => {
    const bw = new THREE.Matrix4().copy(m.skeleton.boneInverses[i]).invert().premultiply(m.bindMatrix);
    const p = new THREE.Vector3().setFromMatrixPosition(bw);
    return { name: b.name, parent: bones.indexOf(b.parent), p: p.toArray() };
  });
  out.bindIsWorld = m.bindMatrix.equals(m.matrixWorld);
  const ends = [];
  o.traverse((c) => { if (c.isBone && !bones.includes(c)) ends.push({ name: c.name, parent: bones.indexOf(c.parent), p: c.getWorldPosition(new THREE.Vector3()).toArray() }); });
  out.ends = ends;
}
window.__out = out;
</script></body></html>
