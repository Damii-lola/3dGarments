<!doctype html><html><body><script type="module">
// Dump an FBX's skinned meshes + skeleton (bind pose) as JSON for tools/body/prepare.py
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
const f = new URLSearchParams(location.search).get('f');
const o = await new FBXLoader().loadAsync(`/@fs/home/user/3dGarments/assets/${f}.fbx`);
o.updateMatrixWorld(true);
const meshes = [];
o.traverse((c) => { if (c.isMesh) meshes.push(c); });
const bones = {}; // name → { p: bind world position, parent }
const dump = (m) => {
  const g = m.geometry;
  // bind-pose positions in the skeleton's world: bindMatrix takes geometry space to it
  const M = m.isSkinnedMesh ? m.bindMatrix : m.matrixWorld;
  const pos = g.attributes.position.clone().applyMatrix4(M);
  const d = { name: m.name, P: Array.from(pos.array), I: g.index ? Array.from(g.index.array) : null,
    groups: g.groups.map((x) => [x.start, x.count, x.materialIndex]), mats: [].concat(m.material).map((x) => x.name) };
  if (m.isSkinnedMesh) {
    const sb = m.skeleton.bones;
    d.boneNames = sb.map((b) => b.name);
    d.SI = Array.from(g.attributes.skinIndex.array); d.SW = Array.from(g.attributes.skinWeight.array);
    sb.forEach((b, i) => {
      if (bones[b.name]) return;
      const bw = new THREE.Matrix4().copy(m.skeleton.boneInverses[i]).invert();
      let q = b.parent;
      while (q && q.name === b.name) q = q.parent; // FBX can wrap a bone in a same-named node
      bones[b.name] = { p: new THREE.Vector3().setFromMatrixPosition(bw).toArray(), parent: q?.isBone ? q.name : null };
    });
  }
  return d;
};
window.__out = { meshes: meshes.map(dump), bones };
</script></body></html>
