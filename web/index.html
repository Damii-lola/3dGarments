<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3dGarments Studio</title>
  <meta name="description" content="Try clothes on a realistic 3D model shaped to real measurements." />
  <meta name="theme-color" content="#0d0e12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5b3a'/%3E%3Cpath d='M10 9l3-2h6l3 2 4 4-3 3-2-2v11H11V14l-2 2-3-3z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">3d<b>Garments</b></span>
      </a>
    </header>

    <aside class="panel" id="panel" aria-label="Your model"></aside>

    <main class="stage" id="stage">
      <div class="stage-canvas" id="stage-canvas"></div>
      <div class="loader" id="loader"><div class="spinner"></div><span>Loading your 3D model…</span></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
