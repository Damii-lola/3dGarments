<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e12" />
    <title>3dGarments — Find your size</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="stage">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">3d<b>Garments</b></span>
      </div>

      <header class="intro">
        <h1>Find your size</h1>
        <p class="lead">
          Record a 360&deg; video of yourself so we can guess your approximate size.
          Stand still and slowly turn all the way around &mdash; max 30 seconds.
        </p>
      </header>

      <!-- Just a button. Tapping it opens the phone's native camera app. -->
      <label class="open-camera" for="video-input">
        <input
          id="video-input"
          class="visually-hidden"
          type="file"
          accept="video/*"
          capture="environment"
        />
        <svg class="cam-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1-1.6A2 2 0 0 1 10.4 3.5h3.2a2 2 0 0 1 1.7 1L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z" />
          <circle cx="12" cy="12.2" r="3.6" />
        </svg>
        <span>Open camera</span>
      </label>

      <section class="result" id="result" hidden>
        <video id="preview" controls playsinline></video>
        <p class="result-text" id="result-text"></p>
        <button class="btn-ghost" id="retake-btn" type="button">Record again</button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
