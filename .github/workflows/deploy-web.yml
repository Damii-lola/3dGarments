name: Deploy web → GitHub Pages

# Runs on EVERY push to main: if the repo is also set to "Deploy from a branch", GitHub publishes
# the raw repository on each push, and only a fresh deploy of the built site can replace it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set these under Settings → Secrets and variables → Actions → Variables.
          # Unset = the site runs in local-only mode (still fully usable).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: cp dist/index.html dist/404.html
      - name: Build lab → /test
        working-directory: test
        run: npm ci && npx vite build --outDir ../web/dist/test --emptyOutDir
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Serve Pages from this workflow (not the raw branch)
        continue-on-error: true
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow \
            && echo "Pages source is now GitHub Actions" \
            || echo "::warning::Could not switch Pages to 'GitHub Actions' (Settings → Pages → Source). Deploying after the branch build instead."
      - name: Let any branch build of this commit finish first, so this deploy lands last
        run: |
          for i in $(seq 1 60); do
            states=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status] | join(" ")')
            if [ -z "$states" ] && [ "$i" -ge 4 ]; then echo "no branch build"; break; fi
            if [ -n "$states" ] && ! echo "$states" | grep -qE 'queued|in_progress|waiting|requested|pending'; then echo "branch build done: $states"; break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
